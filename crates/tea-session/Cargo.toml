[package]
name = "tea-session"
version = "0.1.0"
description = "Append-only session log, replay, and storage contracts for tea-rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false
readme = "README.md"
keywords = ["agent", "session", "event-log"]
categories = ["data-structures"]

[dependencies]
tea-policy = { version = "=0.1.0", path = "../tea-policy" }
tea-protocol = { version = "=0.1.0", path = "../tea-protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tea-tools = { version = "=0.1.0", path = "../tea-tools", default-features = false }
tokio.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
