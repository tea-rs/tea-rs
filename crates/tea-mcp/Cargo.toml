[package]
name = "tea-mcp"
version = "0.1.0"
description = "Bounded MCP adapter contracts for tea-rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false
readme = "README.md"
keywords = ["agent", "mcp", "tools"]
categories = ["api-bindings", "asynchronous"]

[lib]
# Re-enable when this crate gains executable documentation examples.
doctest = false

[features]
default = []
fixture-server = []

[dependencies]
async-stream.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tea-control = { version = "=0.1.0", path = "../tea-control" }
tea-protocol = { version = "=0.1.0", path = "../tea-protocol" }
tea-tools = { version = "=0.1.0", path = "../tea-tools", default-features = false, features = ["execution"] }
tokio = { workspace = true, features = ["io-util", "process", "sync", "time"] }
tokio-util.workspace = true

[dev-dependencies]
futures-util.workspace = true
tea-testkit = { version = "=0.1.0", path = "../tea-testkit" }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[[bin]]
name = "tea-mcp-fixture-server"
path = "tests/fixture_server/main.rs"
required-features = ["fixture-server"]
test = false

[lints]
workspace = true
