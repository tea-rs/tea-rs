name: Bug report
description: Report a reproducible problem in Tea.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private source, customer data, or exploit
        details. Use synthetic inputs and contact the maintainers privately for
        security issues.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which Tea version or commit shows the problem?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - runtime
        - protocol
        - model provider
        - tools
        - policy
        - sessions
        - MCP
        - CLI or TUI
        - build or packaging
        - other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest safe example and exact commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
