[package]
name = "tea-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.97.1"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.140"
tea-protocol = { path = "../crates/tea-protocol" }
tea-session = { path = "../crates/tea-session" }
tea-tools = { path = "../crates/tea-tools", default-features = false }

[[bin]]
name = "protocol_decode"
path = "fuzz_targets/protocol_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_replay"
path = "fuzz_targets/session_replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tool_arguments"
path = "fuzz_targets/tool_arguments.rs"
test = false
doc = false
bench = false

[workspace]
